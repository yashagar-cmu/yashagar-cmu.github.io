<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',ui-rounded,sans-serif">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter>
  </defs>
  <style>
    .ttl { font-size: 19px; font-weight: 700; fill: #1e1e1e; }
    .t   { font-size: 14px; fill: #1e1e1e; }
    .s   { font-size: 12px; fill: #6b7280; }
    .w   { font-size: 12px; fill: #1e1e1e; font-weight: 700; }
  </style>
  <text x="24" y="34" class="ttl">Why one mmap caps touch at ~33 GiB/s</text>

  <!-- LEFT: single VMA -->
  <text x="50" y="68" class="t" font-weight="700">one VMA → one shared fault lock</text>
  <g filter="url(#rough)" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5">
    <rect x="50" y="82" width="46" height="24" rx="3"/><rect x="104" y="82" width="46" height="24" rx="3"/>
    <rect x="158" y="82" width="46" height="24" rx="3"/><rect x="212" y="82" width="46" height="24" rx="3"/>
  </g>
  <g class="w" text-anchor="middle"><text x="73" y="99">T0</text><text x="127" y="99">T1</text><text x="181" y="99">T2</text><text x="235" y="99">T3</text></g>
  <g filter="url(#rough)" stroke="#e03131" stroke-width="2" fill="none">
    <line x1="73" y1="106" x2="155" y2="150"/><line x1="127" y1="106" x2="155" y2="150"/>
    <line x1="181" y1="106" x2="155" y2="150"/><line x1="235" y1="106" x2="155" y2="150"/>
  </g>
  <g filter="url(#rough)"><rect x="100" y="150" width="110" height="32" rx="4" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/></g>
  <text x="155" y="171" class="w" text-anchor="middle">1 lock</text>
  <text x="155" y="206" class="s" text-anchor="middle">cacheline bounces across cores</text>
  <g filter="url(#rough)"><rect x="60" y="232" width="190" height="26" rx="3" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1.5"/></g>
  <text x="155" y="249" class="t" text-anchor="middle">one contiguous buffer</text>
  <text x="155" y="288" class="t" text-anchor="middle" font-weight="700" fill="#e03131">touch stuck at ~33 GiB/s</text>

  <line x1="400" y1="56" x2="400" y2="300" stroke="#ced4da" stroke-dasharray="4 4"/>

  <!-- RIGHT: per-chunk VMAs -->
  <text x="430" y="68" class="t" font-weight="700">per-chunk VMAs → independent locks</text>
  <g filter="url(#rough)" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5">
    <rect x="430" y="82" width="46" height="24" rx="3"/><rect x="494" y="82" width="46" height="24" rx="3"/>
    <rect x="558" y="82" width="46" height="24" rx="3"/><rect x="622" y="82" width="46" height="24" rx="3"/>
  </g>
  <g class="w" text-anchor="middle"><text x="453" y="99">T0</text><text x="517" y="99">T1</text><text x="581" y="99">T2</text><text x="645" y="99">T3</text></g>
  <g stroke="#2f9e44" stroke-width="2">
    <line x1="453" y1="106" x2="453" y2="150"/><line x1="517" y1="106" x2="517" y2="150"/>
    <line x1="581" y1="106" x2="581" y2="150"/><line x1="645" y1="106" x2="645" y2="150"/>
  </g>
  <g filter="url(#rough)" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5">
    <rect x="433" y="150" width="40" height="32" rx="4"/><rect x="497" y="150" width="40" height="32" rx="4"/>
    <rect x="561" y="150" width="40" height="32" rx="4"/><rect x="625" y="150" width="40" height="32" rx="4"/>
  </g>
  <text x="549" y="206" class="s" text-anchor="middle">faults are independent — no contention</text>
  <g filter="url(#rough)" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1.2">
    <rect x="433" y="232" width="58" height="26"/><rect x="491" y="232" width="58" height="26"/>
    <rect x="549" y="232" width="58" height="26"/><rect x="607" y="232" width="58" height="26"/>
  </g>
  <text x="549" y="249" class="t" text-anchor="middle">still one contiguous buffer</text>
  <text x="549" y="288" class="t" text-anchor="middle" font-weight="700" fill="#2f9e44">touch scales to ~99 GiB/s</text>
</svg>
