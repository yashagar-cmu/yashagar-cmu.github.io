    Experience:
      - company: Modular Inc
        position: AI Performance Engineering Intern
        location: San Francisco, CA
        url: https://www.modular.com/
        start_date: 2026-05
        highlights:
          - >-
            Accelerated pinned (page-locked, DMA-capable) host-memory allocation by 10x for tiered KV-cache
            offload, cutting a 1.5TB allocation from 50+ minutes to under 5, unblocking trillion-parameter
            MoE serving on 8-GPU nodes.
          - >-
            Built a lock-free MPSC pipeline that faults pages across NUMA-pinned threads at 99.2 GB/s,
            isolates per-region fault locks via low-level Linux VM syscalls to eliminate lock contention,
            and pipelines it with chunked GPU registration.

      - company: Squarepoint Capital
        position: Software Developer, C++
        location: Bangalore, India
        url: https://www.squarepoint-capital.com/
        start_date: 2023-07
        end_date: 2025-07
        highlights:
          - >-
            Architected new trading capabilities for FX Options, implementing an end-to-end solution in
            C++20 and Python using STL, object-oriented design and comprehensive tests, pioneering a new
            asset class capability at the firm.
          - "Redesigned the messaging protocol by refactoring a 2000+ line C++ protocol into a modular object-oriented structure."
          - "Debugged critical production crashes using gdb core dump analysis and implemented thread-safety in memory access."
          - "Redesigned a multithreaded Python testing framework to a single-threaded architecture, eliminating 40% of test flakes."

    Projects:
      - name: Needle - Optimizing CUDA GPU Kernels and Autodiff
        summary: "Deep Learning Systems course project, Fall 2025."
        start_date: 2025-09
        end_date: 2025-12
        highlights:
          - "Optimized a Matmul CUDA kernel by tiling, vectorization and GMEM coalescing, achieving 85% of cuBLAS performance."
          - "Implemented Flash Attention, including kernel fusion, tiling and online softmax, achieving 77% of PyTorch performance."
          - "Architected automatic differentiation Tensor, complete with mathematical ops and nn.Modules for Conv, RNN and MHA."
          - "Developed an NDArray class supporting reshaping, broadcasting, summation and Matmul using C++ and CUDA backends."

      - name: WhisQer - Quantization-trained Conformer
        summary: "Deep Learning course project, Fall 2025."
        start_date: 2025-09
        end_date: 2025-12
        highlights:
          - >-
            Architected a quantized Conformer ASR with 2-bit and 1-bit precision variants and learnable
            scaling parameters, compressing a 108MB FP32 model to 45.6MB at 2-bit by quantizing encoder
            FFN and attention projections.
          - "Implemented teacher-student co-training combining CTC and KL divergence loss with a straight-through estimator."
          - "Built an end-to-end PyTorch ASR training pipeline with a streaming audio dataloader, feature pipeline and CTC decoding."

      - name: Malloc, Cache and Shell
        summary: "Computer Systems course projects, Spring 2026."
        start_date: 2026-01
        end_date: 2026-05
        highlights:
          - "Implemented malloc using mmap and free-lists - implicit, explicit and segregated, with block coalescing and various fit policies."
          - "Optimized throughput using a Better Fit policy and memory utilization using seg-lists with miniblocks and no footers."
          - "Implemented a cache simulator and optimized matrix transpose by tiling and eliminating evictions - 4th in a class of 200."
          - "Implemented a Unix shell with signal handling, bg/fg commands, forking and reaping child processes, and IO redirection."
          - "Parallelized a file system with RW locks, enabling concurrent reads and writes to shared inodes, blocks and directories."

    Publications:
