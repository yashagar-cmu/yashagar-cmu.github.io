name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets other workflows (update-resume.yml) run this deploy inside their own
  # run. A commit pushed with GITHUB_TOKEN cannot trigger a workflow, so calling
  # this directly is how an automated commit reaches the live site.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the triggering commit)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node ⚙️
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install 💾
        run: npm ci

      - name: Build 🔧
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
