name: Update resume PDF

# Exports the resume Google Doc to assets/pdf/resume.pdf once a day.
#
# The doc is shared "anyone with the link can view", so Google's export
# endpoint needs no credentials and the job needs no secrets. Google renders
# the PDF server-side, so there is no .docx step and no local conversion.
#
# A commit only happens when the exported bytes hash differently from the PDF
# already in the repo. See bin/update_resume_pdf.py and RESUME-SYNC.md.

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-resume
  cancel-in-progress: false

jobs:
  update-resume:
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    env:
      GDOC_ID: 1wMSrMhU9DBhfyTFLW_fJJiLEUP43SyIkTrdcHro12t8
      RESUME_PDF_PATH: assets/pdf/resume.pdf
      RESUME_META_PATH: _data/resume.yml
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Export the document 📄
        id: export
        run: python3 bin/update_resume_pdf.py

      - name: Commit 📝
        if: steps.export.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESUME_PDF_PATH" "$RESUME_META_PATH"
          if git diff --cached --quiet; then
            echo "Nothing staged; skipping commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update resume PDF from Google Docs"

          # Other workflows in this repo also push to main (the TOC updater, for
          # one), so the ref can move between checkout and push. Rebase and retry
          # instead of failing the run and leaving the PDF unpublished.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5); rebasing onto origin/main."
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Rebase onto origin/main failed."
              exit 1
            fi
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

  # A commit pushed with GITHUB_TOKEN deliberately does not trigger other
  # workflows, so the push above will not start a deploy on its own. Calling
  # deploy.yml as a reusable workflow runs it inside this same run instead,
  # which needs no personal access token. `ref: main` is required because the
  # commit above is newer than the SHA that triggered this run.
  deploy:
    needs: update-resume
    if: needs.update-resume.outputs.committed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    permissions:
      contents: write
