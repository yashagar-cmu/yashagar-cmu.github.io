name: Update resume PDF

# Exports the Google Doc resume to assets/pdf/resume.pdf once a day.
#
# The job is gated on the Drive `version` field, so a run against an unedited
# doc makes one metadata call and stops - no download, no commit. See
# bin/update_resume_pdf.py and the setup notes in RESUME-SYNC.md.

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Export even if the document version is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-resume
  cancel-in-progress: false

jobs:
  update-resume:
    runs-on: ubuntu-latest
    env:
      GDOC_ID: 1wMSrMhU9DBhfyTFLW_fJJiLEUP43SyIkTrdcHro12t8
      RESUME_PDF_PATH: assets/pdf/resume.pdf
      VERSION_FILE: .github/resume-version.json
      DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Python 🐍
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies 💾
        run: pip install --quiet google-auth requests

      - name: Export the document 📄
        id: export
        env:
          GDOC_SERVICE_ACCOUNT_KEY: ${{ secrets.GDOC_SERVICE_ACCOUNT_KEY }}
          FORCE: ${{ inputs.force }}
        run: python bin/update_resume_pdf.py

      - name: Commit 📝
        if: steps.export.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESUME_PDF_PATH" "$VERSION_FILE"
          if git diff --cached --quiet; then
            echo "Nothing staged; skipping commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update resume PDF from Google Docs"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits made with GITHUB_TOKEN deliberately do not trigger other
      # workflows, so the deploy has to be kicked off explicitly. Needs a PAT
      # with `workflow` scope stored as the DEPLOY_PAT secret; without it the
      # new PDF simply ships with the next push to main.
      - name: Trigger site deploy 🚀
        if: steps.commit.outputs.committed == 'true' && env.DEPLOY_PAT != ''
        env:
          GH_TOKEN: ${{ env.DEPLOY_PAT }}
        run: gh workflow run deploy.yml --ref main
