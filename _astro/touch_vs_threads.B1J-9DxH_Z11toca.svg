<svg viewBox="0 0 780 390" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',ui-rounded,sans-serif">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter>
  </defs>
  <style>
    .ttl { font-size: 19px; font-weight: 700; fill: #1e1e1e; }
    .s   { font-size: 12px; fill: #6b7280; }
    .lab { font-size: 13px; font-weight: 700; }
  </style>
  <text x="24" y="34" class="ttl">Touch bandwidth vs thread count (64 GiB)</text>

  <!-- plot x:90..690 y:70..320 value 0..105 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="320" x2="690" y2="320"/>
    <line x1="90" y1="253" x2="690" y2="253"/>
    <line x1="90" y1="187" x2="690" y2="187"/>
    <line x1="90" y1="120" x2="690" y2="120"/>
    <line x1="90" y1="70"  x2="690" y2="70"/>
  </g>
  <g class="s" text-anchor="end">
    <text x="82" y="324">0</text><text x="82" y="257">25</text>
    <text x="82" y="191">50</text><text x="82" y="124">75</text><text x="82" y="74">100</text>
  </g>
  <text x="30" y="195" class="s" transform="rotate(-90 30 195)" text-anchor="middle">touch GiB/s</text>
  <g class="s" text-anchor="middle">
    <text x="90" y="340">8</text><text x="210" y="340">16</text><text x="330" y="340">32</text>
    <text x="450" y="340">48</text><text x="570" y="340">64</text><text x="690" y="340">96</text>
  </g>
  <text x="390" y="364" class="s" text-anchor="middle">touch threads</text>

  <!-- write-bandwidth ceiling ~100 dashed red, y for 100 = 320-(100/105*250)=320-238=82 -->
  <line x1="90" y1="82" x2="690" y2="82" stroke="#e03131" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="690" y="76" class="s" fill="#e03131" text-anchor="end">~100 GiB/s — memory write bandwidth ceiling</text>

  <!-- register floor ~27, y=320-(27/105*250)=320-64=256 -->
  <line x1="90" y1="256" x2="690" y2="256" stroke="#f08c00" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="96" y="250" class="s" fill="#e8590c">~27 GiB/s — serial register floor (must clear this)</text>

  <!-- per-chunk VMA (Excalidraw blue, the winner): 20.4 38.3 51.1 50.2 67.2 98.8 -->
  <!-- y: 271, 229, 199, 200, 160, 85 -->
  <g filter="url(#rough)"><polyline fill="none" stroke="#1971c2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
    points="90,271 210,229 330,199 450,200 570,160 690,85"/></g>
  <g fill="#1971c2">
    <circle cx="90" cy="271" r="4"/><circle cx="210" cy="229" r="4"/><circle cx="330" cy="199" r="4"/>
    <circle cx="450" cy="200" r="4"/><circle cx="570" cy="160" r="4"/><circle cx="690" cy="85" r="4"/>
  </g>
  <text x="560" y="146" class="lab" fill="#1971c2" text-anchor="middle">per-chunk VMAs → 99</text>

  <!-- single VMA (muted gray, the limited one): 19.1 28.0 36.1 30.9 30.1 28.8 -> y: 275 253 234 246 248 251 -->
  <g filter="url(#rough)"><polyline fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="90,275 210,253 330,234 450,246 570,248 690,251"/></g>
  <g fill="#868e96">
    <circle cx="90" cy="275" r="4"/><circle cx="210" cy="253" r="4"/><circle cx="330" cy="234" r="4"/>
    <circle cx="450" cy="246" r="4"/><circle cx="570" cy="248" r="4"/><circle cx="690" cy="251" r="4"/>
  </g>
  <text x="450" y="226" class="lab" fill="#495057" text-anchor="middle">single VMA → stuck ~33</text>

</svg>
