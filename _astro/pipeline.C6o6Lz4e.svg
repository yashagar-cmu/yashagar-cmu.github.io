<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',ui-rounded,sans-serif">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
  </defs>
  <style>
    .ttl { font-size: 19px; font-weight: 700; fill: #1e1e1e; }
    .t   { font-size: 13px; fill: #1e1e1e; }
    .s   { font-size: 12px; fill: #495057; }
    .g   { font-size: 20px; font-weight: 700; }
    .b   { font-size: 13px; font-weight: 700; fill: #1e1e1e; }
  </style>
  <text x="24" y="32" class="ttl">Lock-free handoff: one atomic ready-flag per chunk</text>

  <!-- PRODUCERS (top) -->
  <text x="470" y="58" class="b" text-anchor="middle">touch workers</text>
  <g filter="url(#rough)" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5">
    <rect x="408" y="66" width="58" height="30" rx="4"/>
    <rect x="474" y="66" width="58" height="30" rx="4"/>
    <rect x="540" y="66" width="58" height="30" rx="4"/>
  </g>
  <!-- arrows producers -> frontier cells 7,8,9 -->
  <g stroke="#1971c2" stroke-width="2" fill="#1971c2">
    <line x1="437" y1="96" x2="557" y2="148"/><polygon points="557,150 548,142 552,151"/>
    <line x1="503" y1="96" x2="617" y2="148"/><polygon points="617,150 608,142 612,151"/>
    <line x1="569" y1="96" x2="677" y2="148"/><polygon points="677,150 668,142 672,151"/>
  </g>
  <text x="470" y="122" class="s" text-anchor="middle">fault a chunk, then <tspan font-weight="700" fill="#1971c2">set ready[i] = 1</tspan> (release store)</text>

  <!-- READY-FLAG ARRAY (middle) -->
  <text x="68" y="182" class="b" text-anchor="middle">ready[]</text>
  <!-- cells 0..9 : x = 110 + i*60, w 54, y 152 h 52 -->
  <g filter="url(#rough)" stroke="#1e1e1e" stroke-width="1.5">
    <rect x="110" y="152" width="54" height="52" rx="4" fill="#dee2e6"/>
    <rect x="170" y="152" width="54" height="52" rx="4" fill="#dee2e6"/>
    <rect x="230" y="152" width="54" height="52" rx="4" fill="#dee2e6"/>
    <rect x="290" y="152" width="54" height="52" rx="4" fill="#dee2e6"/>
    <rect x="350" y="152" width="54" height="52" rx="4" fill="#dee2e6"/>
    <rect x="410" y="152" width="54" height="52" rx="4" fill="#dee2e6"/>
    <rect x="530" y="152" width="54" height="52" rx="4" fill="#b2f2bb"/>
    <rect x="590" y="152" width="54" height="52" rx="4" fill="#b2f2bb"/>
    <rect x="650" y="152" width="54" height="52" rx="4" fill="#f1f3f5"/>
  </g>
  <!-- current consumer cell (6) drawn with bold orange outline -->
  <g filter="url(#rough)"><rect x="470" y="152" width="54" height="52" rx="4" fill="#ffd8a8" stroke="#e8590c" stroke-width="3"/></g>
  <!-- glyphs -->
  <g class="g" text-anchor="middle" fill="#868e96">
    <text x="137" y="186">✓</text><text x="197" y="186">✓</text><text x="257" y="186">✓</text>
    <text x="317" y="186">✓</text><text x="377" y="186">✓</text><text x="437" y="186">✓</text>
  </g>
  <text x="497" y="186" class="g" text-anchor="middle" fill="#e8590c">✓</text>
  <g class="g" text-anchor="middle" fill="#2f9e44"><text x="557" y="186">1</text><text x="617" y="186">1</text></g>
  <text x="677" y="186" class="g" text-anchor="middle" fill="#adb5bd">0</text>

  <text x="137" y="222" class="s" text-anchor="middle">chunk 0</text>
  <text x="677" y="222" class="s" text-anchor="middle">chunk 9</text>

  <!-- CONSUMER (bottom) points up at current cell 6 (center 497) -->
  <polygon points="497,210 487,226 507,226" fill="#e8590c"/>
  <text x="120" y="262" class="b" fill="#e8590c">register consumer (one thread, in order):</text>
  <text x="120" y="282" class="s"><tspan font-weight="700">spin until ready[i] == 1</tspan> (acquire load) → pin chunk i → i = i + 1</text>

  <!-- legend -->
  <g font-size="12" fill="#495057">
    <rect x="120" y="306" width="15" height="15" rx="2" fill="#dee2e6" stroke="#1e1e1e"/><text x="142" y="318">registered</text>
    <rect x="252" y="306" width="15" height="15" rx="2" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="274" y="318">pinning now</text>
    <rect x="392" y="306" width="15" height="15" rx="2" fill="#b2f2bb" stroke="#1e1e1e"/><text x="414" y="318">ready, waiting</text>
    <rect x="540" y="306" width="15" height="15" rx="2" fill="#f1f3f5" stroke="#1e1e1e"/><text x="562" y="318">not faulted yet</text>
  </g>

  <text x="24" y="348" class="s">Producers stay ahead, so the consumer rarely waits — and when it catches up it spins on the flag, never takes a lock.</text>
</svg>
